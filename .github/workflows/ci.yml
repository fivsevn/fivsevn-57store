name: Check 57store
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Keep the Spec pin with the checked-out source and local contract copies.
      - name: Read pinned Spec revision
        id: spec_version
        shell: bash
        run: |
          spec_ref="$(cat .github/spec-ref)"
          if [[ ! "$spec_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/spec-ref must contain one full Spec commit SHA"
            exit 1
          fi
          echo "ref=$spec_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: ${{ steps.spec_version.outputs.ref }}
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify shared contract copies
        run: |
          cmp scripts/site_post_metadata.py .metadata-spec/tools/site_post_metadata.py
          cmp scripts/media_naming.py .metadata-spec/tools/media_naming.py
          cmp schemas/content-metadata.schema.json .metadata-spec/content/content-metadata.schema.json
          cmp schemas/site-post.schema.json .metadata-spec/content/site-post.schema.json
      - run: python -m unittest discover -s tests -v
      - name: Verify Cache interaction
        run: node --test tests/test_cache_reveal.mjs
      - name: Validate publication metadata and media
        run: |
          python scripts/site_post_metadata.py check --site sys --root sys --schema-dir schemas
          python scripts/site_post_metadata.py check --site cctv --root cctv --schema-dir schemas
          python scripts/media_naming.py check --site sys --root sys
          python scripts/media_naming.py check --site cctv --root cctv
          python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site sys --content-root sys --root . --schema .metadata-spec/content/content-metadata.schema.json
          python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site cctv --content-root cctv --root . --schema .metadata-spec/content/content-metadata.schema.json
      - run: python scripts/build.py
      - run: python scripts/check.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install browser verification tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Verify store interactions and capture previews
        run: pnpm test:browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 57store-browser-preview
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify project-path preview
        run: |
          python scripts/build.py --output _site-prefixed --base-path /fivsevn-57store
          python scripts/check.py --output _site-prefixed --base-path /fivsevn-57store
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 57store-site-preview
          path: _site
          include-hidden-files: true
          retention-days: 7
