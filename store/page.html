<main class="store-shell">

  <figure class="store-floor" aria-labelledby="store-description">
    {{store_scene}}
    <nav class="store-entries" aria-label="店内入口">{{store_entries}}</nav>
    {{store_labels}}
    <figcaption id="store-description" class="store-visually-hidden">便利店的纵向剖面。上方玻璃自动门进入店内，左边是收银和热食，右边是杂志和店务终端。中央货架有前后横向过道，两侧是咖啡、回收、乳品、冰淇淋和鲜食柜。最深处是饮料柜，柜后独立冷藏间设背面补货架、备用饮料、保温门和风机。后仓与店长工作桌由实体隔墙分开。点按物品出现简短说明；打印机、店务终端、店长桌上的监控电脑可进入对应页面。</figcaption>
  </figure>
